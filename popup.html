<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Tracker - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ========== Reset & Base ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #0f0f2a;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.07);
      --bg-glass: rgba(255, 255, 255, 0.06);
      --bg-glass-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);
      --text-primary: #f0f0ff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.35);
      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.3);
      --accent-purple: #8b5cf6;
      --accent-purple-glow: rgba(139, 92, 246, 0.3);
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.2);
      --accent-red: #ef4444;
      --accent-red-glow: rgba(239, 68, 68, 0.2);
      --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245, 158, 11, 0.2);
      --accent-cyan: #06b6d4;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.08);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      width: 480px;
      min-height: 600px;
      max-height: 600px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ========== Scrollbar ========== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ========== Animations ========== */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent-blue-glow); }
      50% { opacity: 0.5; box-shadow: 0 0 16px var(--accent-blue-glow); }
    }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes count-up { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    .animate-in { animation: fade-in 0.3s ease forwards; }

    /* ========== Header ========== */
    .header {
      background: linear-gradient(180deg, rgba(15, 15, 42, 0.98) 0%, rgba(10, 10, 26, 0.95) 100%);
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-blue-glow), transparent);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 12px var(--accent-blue-glow);
    }

    .brand-text {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: var(--transition);
    }

    .icon-btn:hover {
      background: var(--bg-glass-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    /* ========== Account Bar ========== */
    .account-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-selector { position: relative; flex: 1; }

    .user-dropdown {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      width: 100%;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition);
      font-family: inherit;
    }

    .user-dropdown:hover { background: var(--bg-glass-hover); border-color: var(--border-hover); }
    .user-dropdown.open { border-color: var(--accent-blue); box-shadow: 0 0 0 2px var(--accent-blue-glow); }

    .dropdown-arrow {
      font-size: 10px;
      transition: transform 0.2s;
      color: var(--text-muted);
    }

    .user-dropdown.open .dropdown-arrow { transform: rotate(180deg); }

    .user-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: rgba(15, 15, 42, 0.98);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-md);
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(20px);
      display: none;
    }

    .user-menu.open { display: block; }

    .user-menu-item {
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .user-menu-item:last-of-type { border-bottom: none; }
    .user-menu-item:hover { background: rgba(59, 130, 246, 0.1); }
    .user-menu-item.active { background: rgba(59, 130, 246, 0.15); }

    .user-menu-item-content { display: flex; flex-direction: column; gap: 2px; }
    .user-menu-item-content span:first-child { font-size: 13px; font-weight: 500; }
    .user-menu-stats { font-size: 10px; color: var(--text-muted); }

    .remove-user-btn {
      background: var(--accent-red-glow);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--accent-red);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      opacity: 0;
      transition: var(--transition);
      font-family: inherit;
    }

    .user-menu-item:hover .remove-user-btn { opacity: 1; }
    .remove-user-btn:hover { background: rgba(239, 68, 68, 0.3); }

    .add-user-btn {
      padding: 10px 12px;
      color: var(--accent-green);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      transition: var(--transition);
      border-top: 1px solid var(--border);
    }

    .add-user-btn:hover { background: var(--accent-green-glow); }

    /* Scan Now Button */
    .scan-now-btn {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      font-family: inherit;
      box-shadow: 0 2px 8px var(--accent-blue-glow);
    }

    .scan-now-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-blue-glow); }
    .scan-now-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      flex-shrink: 0;
    }

    .status-dot.scanning { background: var(--accent-blue); animation: pulse-glow 2s infinite; }
    .status-dot.paused { background: var(--accent-amber); }
    .status-dot.error { background: var(--accent-red); }

    .progress-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
      display: none;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 2px;
    }

    /* ========== Navigation Tabs ========== */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      background: rgba(10, 10, 26, 0.6);
      flex-shrink: 0;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      padding: 10px 14px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: var(--transition);
      white-space: nowrap;
      font-family: inherit;
      letter-spacing: 0.2px;
    }

    .tab:hover { color: var(--text-secondary); background: rgba(255,255,255,0.02); }

    .tab.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.05);
    }

    /* ========== Content Area ========== */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* ========== Stats Grid ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .stat-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    .stat-card:hover::before { opacity: 1; }
    .stat-card.blue::before { background: linear-gradient(90deg, var(--accent-blue), transparent); }
    .stat-card.purple::before { background: linear-gradient(90deg, var(--accent-purple), transparent); }
    .stat-card.red::before { background: linear-gradient(90deg, var(--accent-red), transparent); }
    .stat-card.green::before { background: linear-gradient(90deg, var(--accent-green), transparent); }
    .stat-card.amber::before { background: linear-gradient(90deg, var(--accent-amber), transparent); }
    .stat-card.cyan::before { background: linear-gradient(90deg, var(--accent-cyan), transparent); }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      animation: count-up 0.4s ease forwards;
    }

    .stat-sparkline {
      height: 24px;
      margin-top: 6px;
    }

    .stat-change {
      font-size: 10px;
      font-weight: 600;
      margin-top: 4px;
    }

    .stat-change.positive { color: var(--accent-green); }
    .stat-change.negative { color: var(--accent-red); }
    .stat-change.neutral { color: var(--text-muted); }

    /* ========== Health Score ========== */
    .health-section {
      display: flex;
      gap: 14px;
      margin-bottom: 16px;
      align-items: stretch;
    }

    .health-gauge {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 120px;
    }

    .gauge-circle {
      width: 80px;
      height: 80px;
      position: relative;
    }

    .gauge-circle svg { transform: rotate(-90deg); }

    .gauge-circle .gauge-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 6;
    }

    .gauge-circle .gauge-fill {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease;
    }

    .gauge-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .gauge-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .health-breakdown {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .breakdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .breakdown-label {
      flex: 1;
      color: var(--text-secondary);
    }

    .breakdown-bar {
      width: 60px;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }

    .breakdown-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.8s ease;
    }

    .breakdown-value {
      font-weight: 600;
      width: 24px;
      text-align: right;
      font-size: 10px;
    }

    /* ========== Trend Chart ========== */
    .chart-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .chart-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chart-period {
      display: flex;
      gap: 4px;
    }

    .chart-period-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .chart-period-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: white;
    }

    .chart-canvas { width: 100%; height: 120px; }

    /* ========== Event Timeline ========== */
    .timeline-section {
      margin-bottom: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .timeline-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: var(--transition);
      animation: fade-in 0.3s ease forwards;
    }

    .timeline-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
    }

    .timeline-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .timeline-icon.follow { background: var(--accent-green-glow); color: var(--accent-green); }
    .timeline-icon.unfollow { background: var(--accent-red-glow); color: var(--accent-red); }

    .timeline-content { flex: 1; min-width: 0; }

    .timeline-user {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timeline-action {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .timeline-time {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .timeline-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      background-color: var(--bg-glass);
      flex-shrink: 0;
    }

    /* ========== User Cards ========== */
    .user-list { display: flex; flex-direction: column; gap: 6px; }

    .user-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
      cursor: pointer;
    }

    .user-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateX(2px);
    }

    .user-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
      background-color: var(--bg-glass);
    }

    .user-details { flex: 1; min-width: 0; }

    .user-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user-username {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .user-bio {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .badge {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge.unfollow { background: var(--accent-red-glow); color: var(--accent-red); border: 1px solid rgba(239,68,68,0.2); }
    .badge.follow { background: var(--accent-green-glow); color: var(--accent-green); border: 1px solid rgba(16,185,129,0.2); }
    .badge.fan { background: var(--accent-amber-glow); color: var(--accent-amber); border: 1px solid rgba(245,158,11,0.2); }
    .badge.mutual { background: var(--accent-purple-glow); color: var(--accent-purple); border: 1px solid rgba(139,92,246,0.2); }
    .badge.notback { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); }

    .verified-badge { color: #1d9bf0; font-size: 12px; }

    .user-time { font-size: 10px; color: var(--text-muted); }

    .open-profile-btn {
      padding: 4px 6px;
      border: none;
      background: var(--bg-glass);
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
    }

    .open-profile-btn:hover { background: var(--bg-glass-hover); color: var(--text-primary); }

    /* ========== Search & Filter ========== */
    .search-box {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      width: 100%;
      font-size: 12px;
      font-family: inherit;
      margin-bottom: 10px;
      transition: var(--transition);
    }

    .search-box:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 2px var(--accent-blue-glow); }
    .search-box::placeholder { color: var(--text-muted); }

    .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }

    .filter-btn {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 10px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      font-weight: 500;
    }

    .filter-btn:hover { background: var(--bg-glass-hover); border-color: var(--border-hover); }
    .filter-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }

    /* ========== Settings ========== */
    .settings-group {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
    }

    .settings-group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .setting-item:last-child { border-bottom: none; }

    .setting-label {
      font-size: 12px;
      color: var(--text-primary);
    }

    .setting-desc {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Toggle Switch */
    .toggle {
      width: 36px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      flex-shrink: 0;
    }

    .toggle.active { background: var(--accent-blue); }

    .toggle::after {
      content: '';
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: var(--transition);
    }

    .toggle.active::after { left: 18px; }

    /* Range Slider */
    .range-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 120px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent-blue);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-blue-glow);
    }

    .range-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-blue);
      min-width: 30px;
      text-align: right;
    }

    /* Action Buttons */
    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .settings-btn {
      flex: 1;
      padding: 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      text-align: center;
    }

    .btn-export {
      background: var(--accent-green-glow);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
    }

    .btn-export:hover { background: rgba(16, 185, 129, 0.3); }

    .btn-danger {
      background: var(--accent-red-glow);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--accent-red);
    }

    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

    /* ========== Empty State ========== */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }
    .empty-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
    .empty-text { font-size: 11px; line-height: 1.5; }

    /* ========== Info Box ========== */
    .info-box {
      background: rgba(59, 130, 246, 0.06);
      border: 1px solid rgba(59, 130, 246, 0.15);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* ========== Insights Card ========== */
    .insights-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
    }

    .insights-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--accent-blue);
    }

    .insights-item {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .insights-item strong { color: var(--text-primary); font-weight: 600; }

    /* ========== Notification Toast ========== */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      z-index: 9999;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(10px);
      animation: slide-up 0.3s ease;
      max-width: 300px;
      text-align: center;
    }

    .toast.success { background: rgba(16, 185, 129, 0.9); color: white; }
    .toast.error { background: rgba(239, 68, 68, 0.9); color: white; }
    .toast.warning { background: rgba(245, 158, 11, 0.9); color: white; }
    .toast.info { background: rgba(59, 130, 246, 0.9); color: white; }

    /* List count header */
    .list-header {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .list-count {
      background: var(--bg-glass);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 10px;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">X Tracker</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
      </div>
    </div>

    <div class="account-bar">
      <div class="user-selector">
        <div class="user-dropdown" id="userDropdown" role="button" tabindex="0">
          <span id="currentUserDisplay">Select account</span>
          <span class="dropdown-arrow">▾</span>
        </div>
        <div class="user-menu" id="userMenu" role="menu">
          <div id="userMenuItems"></div>
          <div class="add-user-btn" id="addUserBtn" role="button">+ Add Account</div>
        </div>
      </div>
      <button class="scan-now-btn" id="scanNowBtn">⚡ Scan Now</button>
    </div>

    <div class="status-bar">
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Ready</span>
      </div>
      <span id="lastScanText">Never scanned</span>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs" role="tablist">
    <button class="tab active" data-view="dashboard" role="tab">Dashboard</button>
    <button class="tab" data-view="events" role="tab">Events</button>
    <button class="tab" data-view="unfollowers" role="tab">Unfollowers</button>
    <button class="tab" data-view="new" role="tab">New</button>
    <button class="tab" data-view="fans" role="tab">Fans</button>
    <button class="tab" data-view="notfollowback" role="tab">Not Back</button>
    <button class="tab" data-view="following" role="tab">Following</button>
    <button class="tab" data-view="settings" role="tab">Settings</button>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Dashboard View -->
    <div id="dashboardView" role="tabpanel"></div>

    <!-- Events View -->
    <div id="eventsView" style="display:none" role="tabpanel"></div>

    <!-- Unfollowers View -->
    <div id="unfollowersView" style="display:none" role="tabpanel"></div>

    <!-- New Followers View -->
    <div id="newFollowersView" style="display:none" role="tabpanel"></div>

    <!-- Fans View -->
    <div id="fansView" style="display:none" role="tabpanel"></div>

    <!-- Not Following Back View -->
    <div id="notFollowingBackView" style="display:none" role="tabpanel"></div>

    <!-- Following View -->
    <div id="followingView" style="display:none" role="tabpanel"></div>

    <!-- Settings View -->
    <div id="settingsView" style="display:none" role="tabpanel"></div>
  </div>

  <script src="data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
